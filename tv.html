<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>2026 PGA Championship Pool — TV Display</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --pga-blue: #00205B;
  --pga-dark: #001A4D;
  --pga-deeper: #000D2B;
  --pga-darkest: #000714;
  --gold: #D4A843;
  --gold-light: #E8D48B;
  --cream: #FDF8EC;
  --cream-dark: #F5EDD6;
  --text: #1A1F2E;
  --text-light: #4A5A6A;
  --white: #FFFFFF;
  --red: #C0392B;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  font-family: 'DM Sans', sans-serif;
  background: var(--pga-darkest);
  color: var(--white);
  height: 100vh;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
}

/* ========== TOP BAR ========== */
.top-bar {
  background: linear-gradient(90deg, var(--pga-darkest), var(--pga-deeper), var(--pga-darkest));
  border-bottom: 2px solid var(--gold);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.5rem 1.25rem;
  height: 52px;
  flex-shrink: 0;
}
.top-bar-left {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}
.top-bar h1 {
  font-family: 'Playfair Display', serif;
  font-size: 1.3rem;
  font-weight: 900;
  color: var(--gold);
  letter-spacing: 0.04em;
}
.top-bar .event-info {
  font-size: 0.65rem;
  color: rgba(255,255,255,0.4);
  letter-spacing: 0.08em;
}
.top-bar-right {
  display: flex;
  align-items: center;
  gap: 1.25rem;
}
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  font-size: 0.65rem;
  font-weight: 600;
}
.status-badge.live { color: #4ADE80; }
.status-badge .pulse {
  width: 6px; height: 6px;
  background: #4ADE80;
  border-radius: 50%;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(74,222,128,0.4); }
  50% { opacity: 0.6; box-shadow: 0 0 0 5px rgba(74,222,128,0); }
}
.clock {
  font-size: 0.7rem;
  color: var(--gold-light);
  font-weight: 600;
  letter-spacing: 0.04em;
}
.wake-badge {
  font-size: 0.55rem;
  color: rgba(255,255,255,0.3);
  background: rgba(255,255,255,0.06);
  padding: 0.15rem 0.5rem;
  border-radius: 8px;
  letter-spacing: 0.04em;
}

/* ========== MAIN LAYOUT ========== */
.main {
  display: flex;
  height: calc(100vh - 52px);
}

/* ========== LEFT PANEL — POOL ========== */
.panel-pool {
  width: 42%;
  background: linear-gradient(180deg, var(--pga-deeper) 0%, var(--pga-darkest) 100%);
  display: flex;
  flex-direction: column;
  border-right: 2px solid var(--gold);
  overflow: hidden;
}
.panel-header {
  padding: 0.6rem 1rem;
  text-align: center;
  flex-shrink: 0;
}
.panel-header h2 {
  font-family: 'Playfair Display', serif;
  font-size: 1rem;
  color: var(--gold);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.panel-header .panel-sub {
  font-size: 0.6rem;
  color: rgba(255,255,255,0.35);
  margin-top: 0.1rem;
}

/* Pool entries */
.pool-list {
  flex: 1;
  overflow-y: auto;
  padding: 0 0.5rem 0.5rem;
  scrollbar-width: none;
}
.pool-list::-webkit-scrollbar { display: none; }

.pool-entry {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(200,169,81,0.1);
  border-radius: 10px;
  margin-bottom: 0.5rem;
  overflow: hidden;
  transition: all 0.3s;
}
.pool-entry.leader {
  border-color: var(--gold);
  background: rgba(200,169,81,0.08);
  box-shadow: 0 0 20px rgba(200,169,81,0.08);
}

.pool-entry-header {
  display: flex;
  align-items: center;
  padding: 0.5rem 0.75rem;
  gap: 0.6rem;
}
.pool-rank {
  width: 30px; height: 30px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Playfair Display', serif;
  font-weight: 900;
  font-size: 0.85rem;
  flex-shrink: 0;
}
.pool-rank.r1 {
  background: linear-gradient(135deg, var(--gold), #A68B3A);
  color: var(--pga-deeper);
}
.pool-rank.r2 { background: linear-gradient(135deg, #B0B0B0, #808080); color: var(--white); }
.pool-rank.r3 { background: linear-gradient(135deg, #CD7F32, #A0622A); color: var(--white); }
.pool-rank.rn { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.5); }

.pool-name {
  flex: 1;
  font-family: 'Playfair Display', serif;
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--white);
}
.pool-pts {
  font-family: 'Playfair Display', serif;
  font-size: 1.2rem;
  font-weight: 900;
  color: var(--gold);
}
.pool-pts-label {
  font-size: 0.5rem;
  color: rgba(255,255,255,0.35);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  text-align: right;
}

/* Golfer chips inside pool entry */
.pool-golfers {
  display: flex;
  flex-wrap: wrap;
  gap: 0.3rem;
  padding: 0 0.75rem 0.5rem;
}
.golfer-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  background: rgba(255,255,255,0.06);
  border-radius: 6px;
  padding: 0.2rem 0.5rem;
  font-size: 0.62rem;
  color: rgba(255,255,255,0.7);
  white-space: nowrap;
}
.golfer-chip.counting {
  background: rgba(0,103,71,0.3);
  border: 1px solid rgba(0,103,71,0.4);
  color: #7FD4A8;
  font-weight: 600;
}
.golfer-chip.not-counting {
  opacity: 0.4;
}
.chip-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  flex-shrink: 0;
}
.chip-dot.t1 { background: var(--gold); }
.chip-dot.t2 { background: #7FB069; }
.chip-dot.t3 { background: #5B9BD5; }
.chip-dot.t4 { background: #D4915E; }
.chip-dot.t5 { background: #9B8EC0; }
.chip-pos {
  font-weight: 700;
  color: var(--gold-light);
  font-size: 0.58rem;
}
.golfer-chip.counting .chip-pos { color: #A8E6C8; }
.chip-pts {
  font-size: 0.55rem;
  color: rgba(255,255,255,0.35);
}

/* ========== RIGHT PANEL — TOURNAMENT ========== */
.panel-tournament {
  width: 58%;
  background: var(--cream);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.panel-tournament .panel-header {
  background: var(--pga-blue);
  border-bottom: 2px solid var(--gold);
}
.panel-tournament .panel-header h2 { color: var(--gold); }
.panel-tournament .panel-header .panel-sub { color: rgba(255,255,255,0.5); }

/* Tournament leaderboard table */
.tourn-list {
  flex: 1;
  overflow-y: auto;
  scrollbar-width: none;
}
.tourn-list::-webkit-scrollbar { display: none; }

.tourn-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.78rem;
}
.tourn-table thead {
  position: sticky;
  top: 0;
  z-index: 2;
}
.tourn-table th {
  background: var(--pga-dark);
  color: var(--gold-light);
  font-size: 0.6rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 0.4rem 0.6rem;
  text-align: left;
  white-space: nowrap;
}
.tourn-table th:nth-child(1) { width: 45px; text-align: center; }
.tourn-table th:nth-child(3) { text-align: center; }
.tourn-table th:nth-child(4) { text-align: center; }
.tourn-table th:nth-child(5) { text-align: center; }

.tourn-table td {
  padding: 0.35rem 0.6rem;
  border-bottom: 1px solid #E8EDE4;
  color: var(--text);
  white-space: nowrap;
}
.tourn-table tbody tr:hover { background: #F0F8EC; }

.tourn-pos {
  font-weight: 800;
  color: var(--pga-dark);
  text-align: center;
  font-size: 0.8rem;
}
.tourn-name {
  font-weight: 600;
  max-width: 160px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tourn-name.pool-pick {
  color: var(--pga-blue);
}
.tourn-name .pick-badge {
  display: inline-block;
  background: var(--pga-blue);
  color: var(--white);
  font-size: 0.5rem;
  font-weight: 700;
  padding: 0.1rem 0.3rem;
  border-radius: 3px;
  margin-left: 0.3rem;
  vertical-align: middle;
  letter-spacing: 0.04em;
}
.tourn-score {
  text-align: center;
  font-weight: 700;
  color: var(--pga-dark);
}
.tourn-score.under-par { color: var(--red); }
.tourn-today { text-align: center; color: var(--text-light); font-size: 0.72rem; }
.tourn-thru { text-align: center; color: var(--text-light); font-size: 0.72rem; }

.tourn-table tbody tr.mc-row td { color: #999; }
.tourn-table tbody tr.mc-row .tourn-pos { color: var(--red); }

/* ========== CHAMPION OVERLAY ========== */
.champion-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,26,16,0.92);
  z-index: 100;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.champion-overlay.visible { display: flex; }
.champion-card {
  background: linear-gradient(135deg, var(--pga-deeper), var(--pga-dark));
  border: 3px solid var(--gold);
  border-radius: 20px;
  padding: 3rem 4rem;
  box-shadow: 0 0 80px rgba(200,169,81,0.2);
}
.champion-card .trophy { font-size: 4rem; margin-bottom: 0.5rem; }
.champion-card .ch-label {
  font-family: 'Playfair Display', serif;
  font-size: 0.9rem;
  color: var(--gold);
  letter-spacing: 0.3em;
  text-transform: uppercase;
}
.champion-card .ch-name {
  font-family: 'Playfair Display', serif;
  font-size: 2.8rem;
  font-weight: 900;
  color: var(--gold);
  text-shadow: 0 2px 16px rgba(200,169,81,0.4);
  margin: 0.25rem 0;
}
.champion-card .ch-score {
  font-size: 1.2rem;
  color: rgba(255,255,255,0.7);
}

/* ========== LOADING ========== */
.loading-center {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: rgba(255,255,255,0.4);
  font-size: 0.85rem;
}
.loading-center.dark { color: var(--text-light); }

/* ========== CONFETTI ========== */
.confetti-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 101;
}
</style>

<script>
// ============================================================
// CONFIG
// ============================================================
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyrBv9vlyH9xVkevZSB9GVHRBm7gtCOApIfG5PymHSdShB9KbMLTcLJ-Yd2miA7-Edt/exec';
const DEADLINE = new Date('2026-05-15T04:00:00Z'); // Midnight ET May 14
const REFRESH_INTERVAL = 5 * 60 * 1000;
const ESPN_GOLF_URL = 'https://site.api.espn.com/apis/site/v2/sports/golf/leaderboard';

function getPointsForPosition(pos) {
  if (pos <= 0) return 55;
  if (pos === 1) return 1;
  if (pos === 2) return 2;
  if (pos === 3) return 3;
  if (pos <= 5) return 4;
  if (pos <= 10) return 8;
  if (pos <= 20) return 15;
  if (pos <= 30) return 22;
  if (pos <= 40) return 30;
  if (pos <= 50) return 38;
  return 45;
}
const MC_POINTS = 50;
const WD_POINTS = 55;

let tournamentData = null;
let isTournamentComplete = false;

// ============================================================
// WAKE LOCK — keeps iPad awake
// ============================================================
let wakeLock = null;

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      document.getElementById('wakeBadge').textContent = 'SCREEN: AWAKE';
      document.getElementById('wakeBadge').style.color = '#4ADE80';

      wakeLock.addEventListener('release', () => {
        document.getElementById('wakeBadge').textContent = 'SCREEN LOCK: OFF';
        document.getElementById('wakeBadge').style.color = 'rgba(255,255,255,0.3)';
      });
    }
  } catch (err) {
    console.log('Wake Lock not supported or failed:', err);
  }
}

// Re-acquire wake lock when page becomes visible again
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') requestWakeLock();
});

requestWakeLock();

// Also use a hidden video trick as fallback for older iPads
function setupVideoWakeLock() {
  const video = document.createElement('video');
  video.setAttribute('playsinline', '');
  video.setAttribute('muted', '');
  video.setAttribute('loop', '');
  video.style.position = 'fixed';
  video.style.top = '-1px';
  video.style.left = '-1px';
  video.style.width = '1px';
  video.style.height = '1px';
  video.style.opacity = '0.01';

  // Tiny transparent webm
  video.src = 'data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAAIZnJlZQAAAu1tZGF0AAACrQYF//+p3EXpvebZSLeWLNgg2SPu73gyNjQgLSBjb3JlIDE1MiByMjg1NCBlOWE1OTAzIC0gSC4yNjQvTVBFRy00IEFWQyBjb2RlYyAtIENvcHlsZWZ0IDIwMDMtMjAxNyAtIGh0dHA6Ly93d3cudmlkZW9sYW4ub3JnL3gyNjQuaHRtbCAtIG9wdGlvbnM6IGNhYmFjPTEgcmVmPTMgZGVibG9jaz0xOjA6MCBhbmFseXNlPTB4MzoweDExMyBtZT1oZXggc3VibWU9NyBwc3k9MSBwc3lfcmQ9MS4wMDowLjAwIG1peGVkX3JlZj0xIG1lX3JhbmdlPTE2IGNocm9tYV9tZT0xIHRyZWxsaXM9MSA4eDhkY3Q9MSBjcW09MCBkZWFkem9uZT0yMSwxMSBmYXN0X3Bza2lwPTEgY2hyb21hX3FwX29mZnNldD0tMiB0aHJlYWRzPTMgbG9va2FoZWFkX3RocmVhZHM9MSBzbGljZWRfdGhyZWFkcz0wIG5yPTAgZGVjaW1hdGU9MSBpbnRlcmxhY2VkPTAgYmx1cmF5X2NvbXBhdD0wIGNvbnN0cmFpbmVkX2ludHJhPTAgYmZyYW1lcz0zIGJfcHlyYW1pZD0yIGJfYWRhcHQ9MSBiX2JpYXM9MCBkaXJlY3Q9MSB3ZWlnaHRiPTEgb3Blbl9nb3A9MCB3ZWlnaHRwPTIga2V5aW50PTI1MCBrZXlpbnRfbWluPTI1IHNjZW5lY3V0PTQwIGludHJhX3JlZnJlc2g9MCByY19sb29rYWhlYWQ9NDAgcmM9Y3JmIG1idHJlZT0xIGNyZj0yMy4wIHFjb21wPTAuNjAgcXBtaW49MCBxcG1heD02OSBxcHN0ZXA9NCBpcF9yYXRpbz0xLjQwIGFxPTE6MS4wMACAAAAPZYiEBf//+97M2LFigniLIsV8mBEC0QAAAAMAAAMAAAMA';
  document.body.appendChild(video);
  video.play().catch(() => {});
}
setupVideoWakeLock();

// ============================================================
// CLOCK
// ============================================================
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
}
setInterval(updateClock, 1000);
updateClock();

// ============================================================
// HELPERS
// ============================================================
function normalizeName(name) {
  return name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z\s]/g, '').trim();
}

// ============================================================
// FETCH DATA
// ============================================================
async function fetchPoolEntries() {
  try {
    const resp = await fetch(`${APPS_SCRIPT_URL}?action=getPicks`);
    return await resp.json();
  } catch (err) {
    console.error('Pool fetch failed:', err);
    return null;
  }
}

async function fetchESPNData() {
  try {
    const resp = await fetch(ESPN_GOLF_URL);
    const data = await resp.json();
    const events = data.events || [];
    let ev = null;

    for (const event of events) {
      const name = (event.name || '').toLowerCase();
      if (name.includes('pga champ') || name.includes('aronimink') || name.includes('pga')) { ev = event; break; }
    }
    if (!ev && events.length > 0) ev = events[0];
    if (!ev) return null;

    const comp = ev.competitions?.[0];
    if (!comp) return null;

    const competitors = [];
    for (const c of (comp.competitors || [])) {
      const athlete = c.athlete || {};
      const status = c.status || {};
      let posNum = 999, posDisplay = '--', playerStatus = 'active', scoreToPar = '--', today = '--', thru = '--';

      if (status.position) {
        posDisplay = status.position.displayName || status.displayValue || '--';
        posNum = parseInt(status.position.id) || 999;
      }

      const st = status.type?.name || '';
      if (st === 'STATUS_CUT' || status.period === 99) { playerStatus = 'MC'; posDisplay = 'MC'; }
      if (st === 'STATUS_WITHDRAWN' || st === 'STATUS_DISQUALIFIED') { playerStatus = 'WD'; posDisplay = 'WD'; }

      // Total score to par — score.displayValue can lag mid-round, so prefer linescores
      if (c.score) scoreToPar = c.score.displayValue || '--';

      const ls = c.linescores || [];
      const curPeriod = status.period || 1;
      const curRound = ls.find(l => l.period === curPeriod && l.displayValue);

      // Fix total: in round 1, linescore IS the tournament total (more reliable mid-round)
      if (curRound && curPeriod === 1) {
        scoreToPar = curRound.displayValue;
      }

      // Today: show stroke total (67, 72) when round finished, relative-to-par (-3, E) when in progress
      if (curRound) {
        if (status.thru === 18) {
          today = curRound.value ? String(curRound.value) : curRound.displayValue;
        } else if (status.thru > 0) {
          today = curRound.displayValue;
        }
      }

      if (status.thru !== undefined && status.thru !== null) thru = status.thru === 18 ? 'F' : String(status.thru);

      competitors.push({
        name: athlete.displayName || '',
        position: posNum,
        posDisplay,
        scoreToPar,
        today,
        thru,
        status: playerStatus
      });
    }

    // Sort by position
    competitors.sort((a, b) => a.position - b.position);

    const eventStatus = ev.status?.type?.name || '';
    return {
      name: ev.name || 'PGA Championship',
      round: ev.status?.period || Math.max(...(comp.competitors || []).map(c => c.status?.period || 0), 0) || 1,
      isComplete: eventStatus === 'STATUS_FINAL' || ev.status?.type?.completed === true,
      statusDisplay: ev.status?.type?.shortDetail || '',
      competitors
    };
  } catch (err) {
    console.error('ESPN fetch failed:', err);
    return null;
  }
}

// ============================================================
// MATCH & SCORE
// ============================================================
function findGolferScore(golferName) {
  if (!tournamentData) return null;
  const normalized = normalizeName(golferName);
  for (const c of tournamentData.competitors) {
    if (normalizeName(c.name) === normalized) return c;
  }
  const lastName = normalized.split(' ').pop();
  for (const c of tournamentData.competitors) {
    if (normalizeName(c.name).split(' ').pop() === lastName) return c;
  }
  return null;
}

function getTier(entry, name) {
  if (entry.picks.tier1.includes(name)) return 1;
  if (entry.picks.tier2.includes(name)) return 2;
  if (entry.picks.tier3.includes(name)) return 3;
  if (entry.picks.tier4.includes(name)) return 4;
  if (entry.picks.tier5.includes(name)) return 5;
  return 0;
}

function calculateStandings(entries) {
  const standings = entries.map(entry => {
    const allPicks = [
      ...(entry.picks?.tier1 || []), ...(entry.picks?.tier2 || []),
      ...(entry.picks?.tier3 || []), ...(entry.picks?.tier4 || []),
      ...(entry.picks?.tier5 || [])
    ];

    const golfers = allPicks.map(name => {
      const score = findGolferScore(name);
      const tier = getTier(entry, name);
      let points;
      if (!score) { points = WD_POINTS; return { name, tier, points, posDisplay: 'N/A', status: 'unknown' }; }
      if (score.status === 'MC') points = MC_POINTS;
      else if (score.status === 'WD') points = WD_POINTS;
      else points = getPointsForPosition(score.position);
      return { name, tier, points, posDisplay: score.posDisplay, scoreToPar: score.scoreToPar, status: score.status };
    });

    const sorted = [...golfers].sort((a, b) => a.points - b.points);
    const countingSet = new Set(sorted.slice(0, 4).map(g => golfers.indexOf(g)));
    golfers.forEach((g, i) => { g.counting = countingSet.has(i); });

    const totalPoints = sorted.slice(0, 4).reduce((sum, g) => sum + g.points, 0);
    return { name: entry.name, totalPoints, golfers, tiebreakers: entry.tiebreakers || {} };
  });

  standings.sort((a, b) => a.totalPoints - b.totalPoints);
  let rank = 1;
  standings.forEach((s, i) => {
    s.rank = (i > 0 && s.totalPoints === standings[i - 1].totalPoints) ? standings[i - 1].rank : rank;
    rank = i + 2;
  });
  return standings;
}

// ============================================================
// RENDER — POOL
// ============================================================
function renderPool(standings) {
  const el = document.getElementById('poolList');

  // Collect all pool golfer names for highlighting on tournament side
  window.poolGolferNames = new Set();
  // Map golfer name -> who picked them
  window.poolGolferOwners = {};
  standings.forEach(s => {
    s.golfers.forEach(g => {
      const n = normalizeName(g.name);
      window.poolGolferNames.add(n);
      if (!window.poolGolferOwners[n]) window.poolGolferOwners[n] = [];
      window.poolGolferOwners[n].push(s.name);
    });
  });

  el.innerHTML = standings.map(entry => {
    const rankClass = entry.rank <= 3 ? 'r' + entry.rank : 'rn';
    const isLeader = entry.rank === 1;

    // Sort golfers: counting first
    const counting = entry.golfers.filter(g => g.counting).sort((a, b) => a.points - b.points);
    const notCounting = entry.golfers.filter(g => !g.counting).sort((a, b) => a.points - b.points);
    const ordered = [...counting, ...notCounting];

    return `
      <div class="pool-entry${isLeader ? ' leader' : ''}">
        <div class="pool-entry-header">
          <div class="pool-rank ${rankClass}">${entry.rank}</div>
          <div class="pool-name">${entry.name}</div>
          <div style="text-align:right;">
            <div class="pool-pts">${entry.totalPoints}</div>
            <div class="pool-pts-label">points</div>
          </div>
        </div>
        <div class="pool-golfers">
          ${ordered.map(g => `
            <div class="golfer-chip ${g.counting ? 'counting' : 'not-counting'}">
              <span class="chip-dot t${g.tier}"></span>
              ${g.name}
              <span class="chip-pos">${g.posDisplay}</span>
              <span class="chip-pts">${g.points}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');
}

// ============================================================
// RENDER — TOURNAMENT
// ============================================================
function renderTournament() {
  if (!tournamentData) return;

  document.getElementById('tournTitle').textContent = tournamentData.name;
  const sub = tournamentData.isComplete ? 'Final Results' :
    tournamentData.round ? `Round ${tournamentData.round}${tournamentData.statusDisplay ? ' — ' + tournamentData.statusDisplay : ''}` : 'Leaderboard';
  document.getElementById('tournSub').textContent = sub;

  const el = document.getElementById('tournList');
  const poolNames = window.poolGolferNames || new Set();
  const poolOwners = window.poolGolferOwners || {};

  let rows = '';
  for (const c of tournamentData.competitors) {
    const isMC = c.status === 'MC';
    const isWD = c.status === 'WD';
    const normalized = normalizeName(c.name);
    const isPoolPick = poolNames.has(normalized);
    const owners = poolOwners[normalized] || [];
    const ownerBadge = isPoolPick ? owners.map(o => `<span class="pick-badge">${o}</span>`).join(' ') : '';

    const scoreClass = c.scoreToPar !== '--' && c.scoreToPar.startsWith('-') ? ' under-par' : '';

    rows += `<tr class="${isMC || isWD ? 'mc-row' : ''}">
      <td class="tourn-pos">${c.posDisplay}</td>
      <td class="tourn-name${isPoolPick ? ' pool-pick' : ''}">${c.name}${ownerBadge}</td>
      <td class="tourn-score${scoreClass}">${c.scoreToPar}</td>
      <td class="tourn-today">${isMC || isWD ? '' : c.today}</td>
      <td class="tourn-thru">${isMC || isWD ? '' : c.thru}</td>
    </tr>`;
  }

  el.innerHTML = `
    <table class="tourn-table">
      <thead>
        <tr>
          <th>Pos</th>
          <th>Player</th>
          <th>Total</th>
          <th>Today</th>
          <th>Thru</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

// ============================================================
// CHAMPION
// ============================================================
function showChampion(standings) {
  if (!standings.length) return;
  const w = standings[0];
  document.getElementById('chName').textContent = w.name;
  document.getElementById('chScore').textContent = `${w.totalPoints} points`;
  document.getElementById('championOverlay').classList.add('visible');
  launchConfetti();

  // Auto-dismiss after 15 seconds
  setTimeout(() => {
    document.getElementById('championOverlay').classList.remove('visible');
  }, 15000);
}

function launchConfetti() {
  const canvas = document.getElementById('confettiCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const colors = ['#C8A951', '#006747', '#E8D48B', '#FFFFFF', '#004D35', '#FFD700'];
  const particles = [];
  for (let i = 0; i < 200; i++) {
    particles.push({
      x: Math.random() * canvas.width, y: -Math.random() * canvas.height,
      w: Math.random() * 10 + 4, h: Math.random() * 6 + 2,
      color: colors[Math.floor(Math.random() * colors.length)],
      vx: (Math.random() - 0.5) * 4, vy: Math.random() * 3 + 2,
      rot: Math.random() * 360, rotSpeed: (Math.random() - 0.5) * 12, opacity: 1
    });
  }
  let frame = 0;
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    particles.forEach(p => {
      if (p.opacity <= 0) return;
      alive = true;
      p.x += p.vx; p.y += p.vy; p.rot += p.rotSpeed; p.vy += 0.04;
      if (frame > 150) p.opacity -= 0.006;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.globalAlpha = Math.max(0, p.opacity);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    frame++;
    if (alive && frame < 500) requestAnimationFrame(animate);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  animate();
}

// ============================================================
// REFRESH
// ============================================================
async function refresh() {
  const poolData = await fetchPoolEntries();
  tournamentData = await fetchESPNData();

  // Update status
  if (tournamentData) {
    let statusText = tournamentData.isComplete ? 'Final' :
      tournamentData.round ? `Round ${tournamentData.round}` : 'Upcoming';
    document.getElementById('statusText').textContent = statusText;
  }

  if (poolData && poolData.isLocked && poolData.entries) {
    const standings = calculateStandings(poolData.entries);
    renderPool(standings);
    renderTournament();

    if (tournamentData && tournamentData.isComplete && !isTournamentComplete) {
      isTournamentComplete = true;
      showChampion(standings);
    }
  } else if (tournamentData) {
    renderTournament();
    document.getElementById('poolList').innerHTML = '<div class="loading-center">Picks locked at tee-off</div>';
  }
}

// ============================================================
// INIT
// ============================================================
refresh();
setInterval(refresh, REFRESH_INTERVAL);
</script>
